# Optional Blueprint: provision Postgres on Render.
# Link this repo in Render → New → Blueprint, or create Postgres manually
# and paste the External Database URL into Vercel as DATABASE_URL.

databases:
  - name: baseweight-db
    plan: free
    postgresMajorVersion: "16"

# App hosting is on Vercel. If you later want the Next app on Render too,
# uncomment and set DATABASE_URL from the database above.
